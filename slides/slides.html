</div><figcaption><b>1 · cover</b> — Hoy damos un paso más después de MCP. El MCP le daba datos a Claude; una skill le enseña qué hacer con ellos y cómo hacerlo siempre igual. El caso es el que todos sufrimos: limpiar la ENAHO. Al final de la sesión cada uno tendrá una skill que, desde los zip del INEI, arma una base de personas y demuestra que está bien replicando la pobreza oficial de 2024.</figcaption></figure><figure class="slide" id="s-horario"><div class="lienzo"><section id="horario" data-transition="fade" style="background:#F7F3EC;color:#1C1A17;font-family:'Public Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:56px">

</div><figcaption><b>2 · horario</b> — Les cuento el plan para que administren su tiempo. Treinta minutos míos, cuarenta y cinco de ustedes y quince para ver resultados. El proyecto está pensado para terminarse en el tiempo si trabajan con Claude Code desde el principio: no escriban el script a mano, pídanselo y revísenlo.</figcaption></figure><figure class="slide" id="s-problema"><div class="lienzo"><section id="problema" data-transition="fade" style="background:#F7F3EC;color:#1C1A17;font-family:'Public Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:48px">

<div style="display:flex;flex-direction:column;gap:12px;background:#FFFFFF;padding:36px;border-radius:16px;border:1px solid #E5DDD1">

<p style="font-size:36px;line-height:1.4;color:#1C1A17">Cada respuesta parece razonable. Juntas dan cifras de pobreza que no cuadran. <b>Una skill fija las decisiones una vez.</b></p>

</section>
</div><figcaption><b>3 · problema</b> — Este es el problema real. Claude es bueno limpiando datos, pero cada conversación empieza de cero y toma decisiones distintas. En un análisis serio eso es inaceptable: necesito que el filtro, el factor y las llaves sean siempre los mismos, y que cualquiera de mi equipo obtenga la misma base. Eso es lo que resuelve una skill.</figcaption></figure><figure class="slide" id="s-que-es"><div class="lienzo"><section id="que-es" data-transition="fade" style="background:#1C1A17;color:#F7F3EC;font-family:'Public Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:48px">
<div style="display:flex;flex-direction:column;gap:16px">

<div style="display:flex;flex-direction:column;gap:6px"><p style="font-size:28px;font-weight:700;color:#F08A4B">Personal</p><p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#F7F3EC">~/.claude/skills/</p><p style="font-size:26px;color:#D9CFC1">Solo tú, en todos tus proyectos</p></div>
<div style="display:flex;flex-direction:column;gap:6px"><p style="font-size:28px;font-weight:700;color:#F08A4B">Plugin</p><p style="font-family:'JetBrains Mono', 'Courier New', monospace;font-size:24px;color:#F7F3EC">/plugin:skill</p><p style="font-size:26px;color:#D9CFC1">Empaquetada para instalar</p></div>
</div>
</div>

</section>
</div><figcaption><b>4 · que-es</b> — Una skill no es magia: es una carpeta. El único archivo obligatorio es SKILL.md, con instrucciones en Markdown. Al lado pueden ir documentos de referencia y scripts. La diferencia clave: el script se ejecuta, no se lee, así que el código no gasta contexto. Para un proyecto de datos la ponemos en .claude/skills del repositorio, porque así viaja con git y todo el equipo usa exactamente la misma limpieza. Si hay dos con el mismo nombre, gana la personal sobre la del proyecto.</figcaption></figure><figure class="slide" id="s-skill-md"><div class="lienzo"><section id="skill-md" data-transition="fade" style="background:#f7f3ec">
  <div id="p49a3a9eb4d3br0-f91c9388" style="position:absolute; top:128px; left:128px; width:1664px; height:132px; display:flex; flex-direction:column; gap:16px">

</section>
</div><figcaption><b>5 · skill-md</b> — El archivo empieza con un bloque YAML entre tres guiones. En Claude Code todos los campos son opcionales, pero description es la que importa: si falta o es vaga, Claude nunca sabrá cuándo usarla. El name, por defecto, es el nombre de la carpeta. La documentación recomienda nombres en gerundio, como limpiando-enaho, y prohíbe usar las palabras anthropic o claude. El cuerpo son instrucciones normales; la recomendación oficial es mantenerlo bajo 500 líneas y mover el detalle a otros archivos.</figcaption></figure><figure class="slide" id="s-carga"><div class="lienzo"><section id="carga" data-transition="fade" style="background:#f7f3ec">

  </div>

</section>
</div><figcaption><b>6 · carga</b> — Este es el concepto técnico más importante. Claude no lee todas las skills al inicio: solo ve el nombre y la descripción de cada una, unos cien tokens. Cuando un pedido coincide con una descripción, carga el cuerpo de esa skill. Y los archivos de apoyo los abre solo si los necesita. Con los scripts es aún mejor: los ejecuta, y al contexto entra solo la salida, no las cien líneas de pandas. Eso hace que una skill sea más barata y más confiable que pegar un prompt larguísimo.</figcaption></figure><figure class="slide" id="s-invocar"><div class="lienzo"><section id="invocar" data-transition="fade" style="background:#f7f3ec">

</div><figcaption><b>7 · invocar</b> — Hay dos caminos. Por defecto, Claude decide solo cuándo usarla según la descripción. O la llaman ustedes escribiendo barra y el nombre, y pueden pasarle argumentos, que dentro del archivo se leen con $ARGUMENTS o con $0, $1. Los comandos de barra que quizá conocen ya se fusionaron con las skills: un archivo en .claude/commands sigue funcionando, pero lo nuevo se hace como skill. Para ver cuáles tienen, escriban /skills o pregúntenle a Claude qué skills hay. Si editan SKILL.md, Claude Code toma el cambio sin reiniciar.</figcaption></figure><figure class="slide" id="s-description"><div class="lienzo"><section id="description" data-transition="fade" style="background:#F7F3EC;color:#1C1A17;font-family:'Public Sans', Arial, sans-serif;padding:128px 128px 160px;display:flex;flex-direction:column;gap:40px">

</div><figcaption><b>9 · por-que-code</b> — ¿Por qué hacerlo en Claude Code y no pegando un prompt en el chat? Primero, la skill vive en el repositorio: se versiona con git, se revisa en pull requests y el que llega nuevo al equipo la hereda. Segundo, corre en su máquina, con su entorno, sus datos y su internet; en la API de Claude las skills corren en un contenedor sin red y sin poder instalar paquetes, y la ENAHO hay que bajarla. Tercero, el script hace que la limpieza sea idéntica cada vez. Cuarto, se puede evaluar con claude -p, que es lo que harán hoy. Quinto, se combina con lo que ya vimos: el MCP del BCRP, hooks y subagentes. Y sexto, es un estándar abierto, Agent Skills, así que no quedan amarrados: la misma carpeta se puede subir a claude.ai. Ojo: las skills no se sincronizan solas entre Claude Code y claude.ai; cada superficie tiene las suyas.</figcaption></figure><figure class="slide" id="s-libertad"><div class="lienzo"><section id="libertad" data-transition="fade" style="background:#F7F3EC;color:#1C1A17;font-family:'Public Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:40px">

</div><figcaption><b>13 · enaho</b> — La ENAHO viene en módulos. Hoy usamos dos. La sumaria tiene una fila por hogar, con el gasto, el ingreso y la condición de pobreza ya calculada por el INEI. El módulo 200 tiene una fila por persona, con sexo, edad y si vive en el hogar. Las llaves son conglomerado, vivienda y hogar; para personas se suma codperso. Los factores de expansión son distintos: factor07 para hogares y facpob07 para personas. Los links bajan los .dta directo del INEI; cada zip pesa entre 6 y 16 MB. Ábranlos en el navegador y descomprímanlos en una carpeta datos/ que no suben a GitHub.</figcaption></figure><figure class="slide" id="s-pipeline"><div class="lienzo"><section id="pipeline" data-transition="fade" style="background:#1C1A17;color:#F7F3EC;font-family:'Public Sans', Arial, sans-serif;padding:128px;display:flex;flex-direction:column;gap:36px">
